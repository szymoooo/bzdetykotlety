<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Główne</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #0a0e27;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(120, 80, 255, 0.25), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(0, 200, 255, 0.2), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255, 0, 150, 0.15), transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* Animowane kółka w tle */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 500px;
    height: 500px;
    background: rgba(120, 80, 255, 0.3);
    top: -150px;
    left: -150px;
    animation: float1 15s ease-in-out infinite;
  }
  body::after {
    width: 450px;
    height: 450px;
    background: rgba(0, 200, 255, 0.25);
    bottom: -150px;
    right: -150px;
    animation: float2 18s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, -50px) scale(1.15); }
  }

  .container {
    width: 100%;
    max-width: 1100px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeDown 0.8s ease-out;
  }

  .header h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #06b6d4, #f472b6);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .header p {
    color: rgba(255, 255, 255, 0.55);
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .card {
    position: relative;
    padding: 40px 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-decoration: none;
    color: white;
    text-align: center;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    animation: cardIn 0.6s ease-out forwards;
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.3s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Poświata wewnątrz karty */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .card:hover::before {
    opacity: 1;
  }

  .card:hover {
    transform: translateY(-8px);
    border-color: var(--border);
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.4),
      0 0 40px var(--glow);
  }

  .card:active {
    transform: translateY(-2px) scale(0.98);
  }

  .icon {
    font-size: 2.8rem;
    margin-bottom: 16px;
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    z-index: 1;
  }

  .card:hover .icon {
    transform: scale(1.2) rotate(-8deg);
  }

  .card h2 {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
  }

  .card span {
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.45);
    position: relative;
    z-index: 1;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Strzałka w rogu */
  .card::after {
    content: '→';
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 1.2rem;
    opacity: 0;
    transform: translateX(-10px);
    transition: all 0.3s ease;
    color: var(--accent);
  }

  .card:hover::after {
    opacity: 1;
    transform: translateX(0);
  }

  /* Kolory kart */
  .card:nth-child(1) { --glow: rgba(139, 92, 246, 0.35); --border: rgba(139, 92, 246, 0.6); --accent: #a78bfa; }
  .card:nth-child(2) { --glow: rgba(6, 182, 212, 0.35);  --border: rgba(6, 182, 212, 0.6);  --accent: #22d3ee; }
  .card:nth-child(3) { --glow: rgba(244, 114, 182, 0.35); --border: rgba(244, 114, 182, 0.6); --accent: #f472b6; }
  .card:nth-child(4) { --glow: rgba(34, 197, 94, 0.35);  --border: rgba(34, 197, 94, 0.6);  --accent: #4ade80; }
  .card:nth-child(5) { --glow: rgba(251, 146, 60, 0.35); --border: rgba(251, 146, 60, 0.6); --accent: #fb923c; }
  .card:nth-child(6) { --glow: rgba(239, 68, 68, 0.35);  --border: rgba(239, 68, 68, 0.6);  --accent: #f87171; }

  /* Responsywność */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .card { padding: 30px 18px; }
    .icon { font-size: 2.3rem; }
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .header { margin-bottom: 35px; }
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Wybierz stronę</h1>
      <p>Kliknij aby przejść</p>
    </div>

    <div class="grid">
      <a href="https://szymoooo.github.io/bzdetykotlety/cor3.html" class="card">
        <div class="icon">🎯</div>
        <h2>Cor3</h2>
        <span>Otwórz</span>
      </a>

      <a href="https://szymoooo.github.io/bzdetykotlety/cor3a.html" class="card">
        <div class="icon">🎮</div>
        <h2>Cor3a</h2>
        <span>Otwórz</span>
      </a>

      <a href="https://szymoooo.github.io/bzdetykotlety/sniper.html" class="card">
        <div class="icon">🔭</div>
        <h2>Sniper</h2>
        <span>Otwórz</span>
      </a>

      <a href="https://szymoooo.github.io/bzdetykotlety/auto.html" class="card">
        <div class="icon">🚗</div>
        <h2>Auto</h2>
        <span>Otwórz</span>
      </a>

      <a href="https://szymoooo.github.io/bzdetykotlety/auto-filter.html" class="card">
        <div class="icon">⚙️</div>
        <h2>Auto Filter</h2>
        <span>Otwórz</span>
      </a>

      <a href="https://szymoooo.github.io/bzdetykotlety/historia.html" class="card">
        <div class="icon">📜</div>
        <h2>Historia</h2>
        <span>Otwórz</span>
      </a>
    </div>
  </div>
</body>
</html>
