<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Moja Strona - Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #1a3a2a 0%, #2b5e3b 50%, #1a4a2a 100%);
      background-attachment: fixed;
      padding: 20px;
      position: relative;
    }

    /* Delikatny wzór w tle (linie boiska) */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      padding: 40px 50px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 700px;
      width: 100%;
    }

    h1 {
      font-size: 2.8rem;
      text-align: center;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      margin-bottom: 30px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    h1 span {
      background: linear-gradient(45deg, #f5c842, #f7e05e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px 10px;
      text-align: center;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-height: 120px;
      justify-content: center;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .card:active {
      transform: scale(0.97);
    }

    /* Kolory dla poszczególnych przycisków – piłkarskie akcenty */
    .card-cor3 {
      background: linear-gradient(145deg, #1e3a5f, #0f2440);
      border-left: 4px solid #f5c842;
    }
    .card-cor3a {
      background: linear-gradient(145deg, #4a2a1a, #2e1a0e);
      border-left: 4px solid #e67e22;
    }
    .card-sniper {
      background: linear-gradient(145deg, #1a3a2a, #0f261a);
      border-left: 4px solid #2ecc71;
    }
    .card-auto {
      background: linear-gradient(145deg, #3a1a2a, #260f1a);
      border-left: 4px solid #e74c3c;
    }
    .card-filter {
      background: linear-gradient(145deg, #2a1a3a, #1a0f26);
      border-left: 4px solid #9b59b6;
    }
    .card-historia {
      background: linear-gradient(145deg, #1a2a3a, #0f1a26);
      border-left: 4px solid #3498db;
    }

    .card .emoji {
      font-size: 2.2rem;
      line-height: 1;
    }

    .card .label {
      font-size: 1.0rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 2.0rem;
      }
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 14px;
      }
      .card {
        min-height: 100px;
        padding: 14px 8px;
      }
      .card .emoji {
        font-size: 1.8rem;
      }
      .card .label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>⚽ <span>M E N U</span></h1>

  <div class="grid">
    <div class="card card-cor3" onclick="location.href='cor3.html'">
      <span class="emoji">📊</span>
      <span class="label">Cor3</span>
    </div>

    <div class="card card-cor3a" onclick="location.href='cor3a.html'">
      <span class="emoji">📈</span>
      <span class="label">Cor3a</span>
    </div>

    <div class="card card-sniper" onclick="location.href='sniper.html'">
      <span class="emoji">🎯</span>
      <span class="label">Sniper</span>
    </div>

    <div class="card card-auto" onclick="location.href='auto.html'">
      <span class="emoji">⚡</span>
      <span class="label">AUTO</span>
    </div>

    <div class="card card-filter" onclick="location.href='auto-filter.html'">
      <span class="emoji">🔍</span>
      <span class="label">Filter</span>
    </div>

    <div class="card card-historia" onclick="location.href='historia.html'">
      <span class="emoji">📜</span>
      <span class="label">Historia</span>
    </div>
  </div>

  <div class="footer">⚽ 2026 · Twoja baza typów</div>
</div>

</body>
</html>
