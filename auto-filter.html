<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snajper over 3.5 pierwsza połowa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #eee;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #4caf50;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }
    .toolbar button {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2a2a3e;
      color: #eee;
      transition: 0.2s;
    }
    .toolbar button:hover { background: #3a3a5e; }
    .btn-primary {
      background: #4caf50 !important;
      color: #fff !important;
    }
    .btn-primary:hover { background: #66bb6a !important; }
    .btn-danger {
      background: #d32f2f !important;
      color: #fff !important;
    }
    .btn-danger:hover { background: #f44336 !important; }
    .btn-secondary {
      background: #1976d2 !important;
      color: #fff !important;
    }
    .btn-secondary:hover { background: #1e88e5 !important; }
    .btn-warning {
      background: #f57c00 !important;
      color: #fff !important;
    }
    .btn-warning:hover { background: #fb8c00 !important; }

    .status-bar {
      background: #1a1a2e;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .info {
      color: #aaa;
      font-size: 14px;
    }
    .badge {
      background: #4caf50;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
    }

    .kafelki {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 20px 0;
    }
    .kafelek {
      background: #1a1a2e;
      border-left: 4px solid #4caf50;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      width: 100%;
    }
    .kafelek .match-card .models-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 15px;
    }
    .kafelek .match-card table {
      font-size: 0.8rem;
      word-wrap: break-word;
    }
    .kafelek .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      border-top: 1px solid #333;
      padding-top: 10px;
    }
    .kafelek .input-group input {
      flex: 1;
      min-width: 60px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #eee;
      font-size: 16px;
      width: 120px;
      max-width: 200px;
    }
    .kafelek .input-group button {
      padding: 6px 20px;
      background: #4caf50;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    .kafelek .input-group button:hover { background: #66bb6a; }

    .no-results {
      color: #ff6b6b;
      padding: 30px;
      text-align: center;
      background: #1a1a2e;
      border-radius: 8px;
    }

    .history-section {
      margin-top: 40px;
      border-top: 2px solid #333;
      padding-top: 20px;
    }
    .history-section h2 { color: #90caf9; }
    .history-item {
      background: #12121f;
      padding: 10px 16px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px 12px;
    }
    .history-item .main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      flex: 1;
      cursor: pointer;
    }
    .history-item .main:hover { opacity: 0.8; }
    .history-item .match-card {
      width: 100%;
      margin: 10px 0;
      background: #0a0a15;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      overflow: hidden;
    }
    .history-item .match-card .models-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 15px;
    }
    .history-item .match-card table {
      font-size: 0.75rem;
      word-wrap: break-word;
    }
    .history-item .date {
      color: #888;
      font-size: 12px;
      margin-left: auto;
    }
    .win { color: #4caf50; font-weight: bold; }
    .lose { color: #ef5350; font-weight: bold; }
    .pending-result { color: #ffa726; font-weight: bold; }
    .edit-form {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }
    .edit-form input {
      width: 70px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #eee;
      font-size: 14px;
    }
    .edit-form button {
      padding: 4px 12px;
      background: #1976d2;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .edit-form button:hover { background: #1e88e5; }

    .toggle-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      cursor: pointer;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .toggle-btn:hover { background: #2a2a3e; }
    .match-card-wrapper { display: none; }
    .match-card-wrapper.open { display: block; }

    .manual-form {
      background: #1a1a2e;
      padding: 16px 20px;
      border-radius: 8px;
      margin: 20px 0 10px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .manual-form label {
      color: #ccc;
      font-size: 14px;
    }
    .manual-form input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #eee;
      font-size: 14px;
      flex: 1 1 180px;
      min-width: 120px;
    }
    .manual-form button {
      padding: 6px 20px;
      background: #1976d2;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    .manual-form button:hover { background: #1e88e5; }
    .manual-form .info-text {
      color: #888;
      font-size: 13px;
      margin-left: auto;
    }

    /* Ukryty input do importu */
    #fileInput { display: none; }

    @media (max-width: 1024px) {
      .kafelek .match-card .models-grid,
      .history-item .match-card .models-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }
    @media (max-width: 768px) {
      .kafelek .match-card .models-grid,
      .history-item .match-card .models-grid {
        grid-template-columns: 1fr !important;
      }
      .toolbar button { width: 100%; }
      .status-bar { flex-direction: column; align-items: stretch; gap: 8px; }
      .history-item { flex-direction: column; align-items: flex-start; }
      .history-item .date { margin-left: 0; margin-top: 4px; }
      .manual-form { flex-direction: column; align-items: stretch; }
      .manual-form .info-text { margin-left: 0; }
      .edit-form { margin-left: 0; margin-top: 6px; }
    }
  </style>

  <!-- Style z auto.html -->
  <style>

    .match-card{background:#1e1e1e;border:1px solid #333;margin-bottom:30px;padding:15px;border-radius:8px}
    .match-header{border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .match-title{font-size:1.5em;font-weight:bold;color:#fff}
    .league-badge{background:#333;color:#fff;padding:2px 8px;border-radius:4px;font-size:0.8em;margin-right:10px}

    .tc-badge-N{background:#2a1a1a;color:#ff6666;padding:2px 8px;border-radius:4px;font-size:0.8em;margin-left:4px}

  </style>
</head>
<body>

<h1>⚽ Snajper over 3.5 pierwsza połowa</h1>

<div class="toolbar">
  <button class="btn-primary" onclick="fetchAndDisplay()">🔄 Sprawdź teraz</button>
  <button class="btn-danger" onclick="clearHistory()">🗑️ Wyczyść historię</button>
  <button class="btn-secondary" onclick="exportHistory()">📥 Eksportuj JSON</button>
  <button class="btn-warning" onclick="document.getElementById('fileInput').click()">📤 Importuj JSON</button>
  <input type="file" id="fileInput" accept=".json" onchange="importHistory(event)">
</div>

<div class="status-bar">
  <span class="info" id="lastUpdate">Ostatnie sprawdzenie: —</span>
  <span class="info" id="matchCount">Aktywne: 0</span>
  <span class="badge" id="autoBadge">⏳ Następne zaplanowane: —</span>
</div>

<div id="kafelkiContainer" class="kafelki">
  <div class="no-results">⏳ Kliknij "Sprawdź teraz" lub poczekaj na automatyczne odświeżenie...</div>
</div>

<div class="manual-form">
  <label for="manualMatchName">Nazwa meczu:</label>
  <input type="text" id="manualMatchName" placeholder="np. Olympique Marseille vs Strasbourg" style="flex:2;">
  <label for="manualCorners">Rzuty rożne HT:</label>
  <input type="number" id="manualCorners" min="0" step="1" placeholder="liczba" style="width:100px;">
  <button onclick="addManualRecord()">➕ Dodaj do historii</button>
  <span class="info-text">(Uzupełnij brakujące mecze)</span>
</div>

<div class="history-section">
  <h2>📜 Historia rozstrzygniętych</h2>
  <div id="historyContainer">
    <p style="color:#888;">Brak zapisanej historii.</p>
  </div>
</div>

<script>
  // ===== KONFIGURACJA =====
  const PROGI = {
    A: { nazwa: 'U5.5', wartosc: 0 },
    B: { nazwa: 'SZYBKI ATAK: ROŻNY (OVER)', minPkt: 90 },
    C: { nazwa: 'ROŻNE HT (OVER 4.5)', minPkt: 90 },
    D: { nazwa: 'DOMINACJA', minPkt: 80 }
  };
  const SOURCE_URL = 'https://szymoooo.github.io/bzdetykotlety/auto.html';
  const SCHEDULED_TIMES = ['09:00', '10:00', '11:00'];

  // ===== ZMIENNE GLOBALNE =====
  let externalStylesInjected = false;

  // ===== FUNKCJE POMOCNICZE =====
  function getMatchKey(matchCardEl) {
    const titleEl = matchCardEl.querySelector('.match-title');
    const title = titleEl ? titleEl.textContent.trim() : 'Nieznany';
    const u55El = matchCardEl.querySelector('.under55-low, .under55-mid, .under55-high');
    let u55 = '0';
    if (u55El) {
      const match = u55El.textContent.match(/U5\.5:\s*(\d+)/);
      if (match) u55 = match[1];
    }
    return title + '|' + u55;
  }

  function getMatchTitle(matchCardEl) {
    const titleEl = matchCardEl.querySelector('.match-title');
    return titleEl ? titleEl.textContent.trim() : 'Nieznany mecz';
  }

  function getScoreHighs(matchCardEl) {
    const scoreHighs = [];
    const modelHeaders = matchCardEl.querySelectorAll('.model-header');
    modelHeaders.forEach(header => {
      const span = header.querySelector('span:first-child');
      if (!span) return;
      const text = span.textContent;
      const pktEl = header.querySelector('.score-high, .score-low, .score-mid');
      if (!pktEl) return;
      const pktText = pktEl.textContent.trim();
      const pkt = parseInt(pktText);
      if (!isNaN(pkt)) {
        let nazwa = '';
        if (text.includes('SZYBKI ATAK')) nazwa = 'SZYBKI ATAK';
        else if (text.includes('ROŻNE HT')) nazwa = 'ROŻNE HT';
        else if (text.includes('DOMINACJA')) nazwa = 'DOMINACJA';
        else if (text.includes('KARTKI')) nazwa = 'KARTKI';
        else nazwa = text.trim().substring(0, 30);
        if (!scoreHighs.some(s => s.nazwa === nazwa)) {
          scoreHighs.push({ nazwa, pkt });
        }
      }
    });
    return scoreHighs;
  }

  function checkCriteria(matchCardEl) {
    const scoreHighs = getScoreHighs(matchCardEl);
    const u55El = matchCardEl.querySelector('.under55-low, .under55-mid, .under55-high');
    let u55 = null;
    if (u55El) {
      const match = u55El.textContent.match(/U5\.5:\s*(\d+)/);
      if (match) u55 = parseInt(match[1]);
    }
    const passA = (u55 !== null && u55 === PROGI.A.wartosc);
    const passB = scoreHighs.some(s => s.nazwa === 'SZYBKI ATAK' && s.pkt >= PROGI.B.minPkt);
    const passC = scoreHighs.some(s => s.nazwa === 'ROŻNE HT' && s.pkt >= PROGI.C.minPkt);
    const passD = scoreHighs.some(s => s.nazwa === 'DOMINACJA' && s.pkt >= PROGI.D.minPkt);
    return passA && passB && passC && passD;
  }

  function formatDate(date) {
    const d = new Date(date);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    const sec = String(d.getSeconds()).padStart(2, '0');
    return `${dd}.${mm}.${yyyy}, ${hh}:${min}:${sec}`;
  }

  // ===== BEZPIECZNA OBSŁUGA HISTORII Z KOPIĄ ZAPASOWĄ =====
  function getHistory() {
    try {
      const data = localStorage.getItem('snajperHistory');
      if (data) {
        const parsed = JSON.parse(data);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      }
      // Jeśli główna historia jest pusta, spróbuj przywrócić z kopii
      const backup = localStorage.getItem('snajperHistoryBackup');
      if (backup) {
        const parsedBackup = JSON.parse(backup);
        if (Array.isArray(parsedBackup) && parsedBackup.length > 0) {
          console.warn('⚠️ Historia główna pusta – przywracam z kopii zapasowej');
          localStorage.setItem('snajperHistory', JSON.stringify(parsedBackup));
          return parsedBackup;
        }
      }
      return [];
    } catch (e) {
      console.error('Błąd odczytu historii', e);
      return [];
    }
  }

  function saveHistory(history) {
    try {
      // Zapisujemy główną historię
      localStorage.setItem('snajperHistory', JSON.stringify(history));
      // Zapisujemy kopię zapasową
      localStorage.setItem('snajperHistoryBackup', JSON.stringify(history));
      console.log(`✅ Historia zapisana (${history.length} wpisów)`);
    } catch (e) {
      console.error('Błąd zapisu historii', e);
    }
  }

  // ===== WSTRZYKIWANIE STYLÓW =====
  async function fetchAndInjectStyles() {
    if (externalStylesInjected) return;
    try {
      const resp = await fetch(SOURCE_URL);
      const html = await resp.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const styleTags = doc.querySelectorAll('style');
      const styleText = Array.from(styleTags).map(s => s.textContent).join('\n');
      if (styleText) {
        const styleEl = document.createElement('style');
        styleEl.textContent = styleText;
        document.head.appendChild(styleEl);
        externalStylesInjected = true;
      }
    } catch(e) {
      console.warn('Nie udało się wstrzyknąć stylów', e);
    }
  }

  // ===== GŁÓWNA FUNKCJA =====
  async function fetchAndDisplay() {
    const container = document.getElementById('kafelkiContainer');
    const lastUpdateSpan = document.getElementById('lastUpdate');
    const matchCountSpan = document.getElementById('matchCount');

    try {
      container.innerHTML = '<div class="no-results">⏳ Ładowanie danych...</div>';

      await fetchAndInjectStyles();

      const response = await fetch(SOURCE_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const html = await response.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      const matchCards = doc.querySelectorAll('.match-card');
      const znalezione = [];
      matchCards.forEach(card => {
        if (checkCriteria(card)) {
          const key = getMatchKey(card);
          const title = getMatchTitle(card);
          const scoreHighs = getScoreHighs(card);
          const isPending = card.textContent.includes('PENDING');
          znalezione.push({
            key,
            title,
            scoreHighs,
            isPending,
            html: card.outerHTML
          });
        }
      });

      const history = getHistory();

      // ===== AKTYWNE: PENDING i NIE w historii z statusem WYGRANY/PRZEGRANY =====
      const historyResolvedKeys = new Set(
        history.filter(h => h.status === 'WYGRANY' || h.status === 'PRZEGRANY').map(h => h.key)
      );

      const aktywne = znalezione.filter(m => m.isPending && !historyResolvedKeys.has(m.key));

      // ===== ARCHIWIZACJA – mecze, które zniknęły =====
      archiveMissingMatches(aktywne.map(m => ({ key: m.key, title: m.title, html: m.html, scoreHighs: m.scoreHighs })));

      // Wyświetlamy kafle
      if (aktywne.length === 0) {
        container.innerHTML = '<div class="no-results">❌ Brak aktywnych meczów spełniających kryteria.</div>';
      } else {
        let htmlOut = '';
        aktywne.forEach((m, idx) => {
          htmlOut += `
            <div class="kafelek" data-key="${m.key}" data-title="${m.title}">
              ${m.html}
              <div class="input-group">
                <input type="number" id="corners_${idx}" min="0" step="1" placeholder="Rzuty rożne HT">
                <button onclick="saveResult('${m.key}', ${idx})">Zapisz</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = htmlOut;
      }

      matchCountSpan.textContent = `Aktywne: ${aktywne.length}`;
      lastUpdateSpan.textContent = `Ostatnie sprawdzenie: ${new Date().toLocaleString()}`;
      renderHistory();

    } catch (error) {
      container.innerHTML = `<div class="no-results">❌ Błąd: ${error.message}</div>`;
      console.error(error);
    }
  }

  // ===== ARCHIWIZACJA =====
  function archiveMissingMatches(currentActive) {
    const prevActive = getPreviousActiveData();
    const history = getHistory();
    const historyKeys = new Set(history.map(h => h.key));
    const currentKeys = new Set(currentActive.map(m => m.key));

    const toArchive = prevActive.filter(item => !currentKeys.has(item.key) && !historyKeys.has(item.key));

    if (toArchive.length > 0) {
      let changed = false;
      toArchive.forEach(item => {
        history.push({
          key: item.key,
          title: item.title,
          html: item.html,
          scoreHighs: item.scoreHighs || [],
          corners: null,
          status: 'OCZEKUJE',
          date: new Date().toISOString(),
          archived: true
        });
        changed = true;
      });
      if (changed) {
        saveHistory(history);
      }
    }

    savePreviousActiveData(currentActive);
  }

  // ===== ODCZYT/ZAPIS POPRZEDNICH AKTYWNYCH =====
  function getPreviousActiveData() {
    try {
      const data = localStorage.getItem('snajperPreviousActiveData');
      return data ? JSON.parse(data) : [];
    } catch { return []; }
  }
  function savePreviousActiveData(data) {
    localStorage.setItem('snajperPreviousActiveData', JSON.stringify(data));
  }

  // ===== ZAPIS WYNIKU =====
  function saveResult(key, idx) {
    const input = document.getElementById(`corners_${idx}`);
    if (!input) return;
    const val = parseInt(input.value);
    if (isNaN(val) || val < 0) {
      alert('Wpisz poprawną liczbę rzutów rożnych (≥0)');
      return;
    }

    const kafelek = document.querySelector(`.kafelek[data-key="${key}"]`);
    if (!kafelek) {
      alert('Ten mecz został już rozstrzygnięty.');
      return;
    }

    const matchCard = kafelek.querySelector('.match-card');
    if (!matchCard) {
      alert('Brak danych meczu.');
      return;
    }
    const html = matchCard.outerHTML;
    const title = kafelek.dataset.title || 'Nieznany mecz';

    const status = val >= 4 ? 'WYGRANY' : 'PRZEGRANY';

    const history = getHistory();
    const filtered = history.filter(h => h.key !== key);
    filtered.push({
      key: key,
      title: title,
      html: html,
      corners: val,
      status: status,
      date: new Date().toISOString()
    });
    saveHistory(filtered);

    kafelek.remove();

    const countSpan = document.getElementById('matchCount');
    const activeCount = document.querySelectorAll('.kafelek').length;
    countSpan.textContent = `Aktywne: ${activeCount}`;

    if (activeCount === 0) {
      const container = document.getElementById('kafelkiContainer');
      container.innerHTML = '<div class="no-results">❌ Brak aktywnych meczów spełniających kryteria.</div>';
    }

    renderHistory();
    alert(`Zapisano: ${title} → ${val} rzutów rożnych → ${status}`);
  }

  // ===== RĘCZNE DODAWANIE =====
  function addManualRecord() {
    const nameInput = document.getElementById('manualMatchName');
    const cornersInput = document.getElementById('manualCorners');
    const name = nameInput.value.trim();
    const corners = parseInt(cornersInput.value);

    if (!name) {
      alert('Wpisz nazwę meczu');
      return;
    }
    if (isNaN(corners) || corners < 0) {
      alert('Wpisz poprawną liczbę rzutów rożnych (≥0)');
      return;
    }

    const key = name + '|manual_' + Date.now();
    const status = corners >= 4 ? 'WYGRANY' : 'PRZEGRANY';
    const history = getHistory();
    history.push({
      key: key,
      title: name,
      html: `<div class="match-card"><div class="match-header"><div><span class="match-title">${name}</span></div></div></div>`,
      corners: corners,
      status: status,
      scoreHighs: [],
      date: new Date().toISOString()
    });
    saveHistory(history);

    nameInput.value = '';
    cornersInput.value = '';

    renderHistory();
    alert(`Dodano: ${name} → ${corners} rzutów rożnych → ${status}`);
  }

  // ===== EDYCJA ZARCHIWIZOWANEGO =====
  function editArchived(key) {
    const input = document.getElementById(`edit_corners_${key}`);
    if (!input) return;
    const val = parseInt(input.value);
    if (isNaN(val) || val < 0) {
      alert('Wpisz poprawną liczbę rzutów rożnych (≥0)');
      return;
    }

    const history = getHistory();
    const idx = history.findIndex(h => h.key === key);
    if (idx === -1) {
      alert('Nie znaleziono rekordu.');
      return;
    }

    const status = val >= 4 ? 'WYGRANY' : 'PRZEGRANY';
    history[idx].corners = val;
    history[idx].status = status;
    history[idx].archived = false;
    saveHistory(history);
    renderHistory();
    alert(`Zaktualizowano: ${history[idx].title} → ${val} rzutów rożnych → ${status}`);
  }

  // ===== IMPORT/EXPORT HISTORII =====
  function exportHistory() {
    const history = getHistory();
    if (history.length === 0) { alert('Brak historii do eksportu.'); return; }
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `historia_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importHistory(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('Nieprawidłowy format – oczekiwano tablicy');
        if (data.length === 0) { alert('Plik jest pusty.'); return; }
        if (confirm(`Zaimportować ${data.length} wpisów? Istniejąca historia zostanie zastąpiona.`)) {
          saveHistory(data);
          renderHistory();
          fetchAndDisplay();
          alert(`Zaimportowano ${data.length} wpisów.`);
        }
      } catch (err) {
        alert('Błąd importu: ' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = ''; // reset
  }

  // ===== CZYSZCZENIE =====
  function clearHistory() {
    if (confirm('Usunąć całą historię? Tej operacji nie można cofnąć.')) {
      localStorage.removeItem('snajperHistory');
      localStorage.removeItem('snajperHistoryBackup');
      localStorage.removeItem('snajperPreviousActiveData');
      renderHistory();
      fetchAndDisplay();
      alert('Historia usunięta.');
    }
  }

  // ===== RENDER HISTORII =====
  function toggleHistory(key) {
    const wrapper = document.getElementById(`history_${key}`);
    if (wrapper) {
      wrapper.classList.toggle('open');
    }
  }

  function renderHistory() {
    const container = document.getElementById('historyContainer');
    const history = getHistory();
    if (history.length === 0) {
      container.innerHTML = '<p style="color:#888;">Brak zapisanej historii.</p>';
      return;
    }
    const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
    let html = '';
    sorted.forEach(h => {
      const statusClass = h.status === 'WYGRANY' ? 'win' : (h.status === 'PRZEGRANY' ? 'lose' : 'pending-result');
      const dateStr = formatDate(h.date);
      let editForm = '';
      if (h.status === 'OCZEKUJE') {
        editForm = `
          <span class="edit-form">
            <input type="number" id="edit_corners_${h.key}" min="0" step="1" placeholder="wynik" style="width:60px;">
            <button onclick="editArchived('${h.key}')">Uzupełnij</button>
          </span>
        `;
      }

      const matchHtml = h.html || `<div class="match-card"><div class="match-header"><div><span class="match-title">${h.title}</span></div></div></div>`;

      html += `
        <div class="history-item">
          <div class="main" onclick="toggleHistory('${h.key}')">
            <strong>${h.title}</strong>
            <span class="${statusClass}">${h.status}</span>
            ${h.corners !== null && h.corners !== undefined ? `(${h.corners} rzutów rożnych)` : ''}
            ${editForm}
            <button class="toggle-btn">${h.status === 'OCZEKUJE' ? '📋' : '📊'}</button>
          </div>
          <div class="date">🕒 ${dateStr}</div>
          <div id="history_${h.key}" class="match-card-wrapper">
            <div class="match-card" style="width:100%; margin-top:8px; background:#0a0a15; padding:10px; border-radius:6px;">
              ${matchHtml}
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // ===== HARMONOGRAM =====
  function getNextScheduledTime() {
    const now = new Date();
    const current = now.getHours() * 60 + now.getMinutes();
    const scheduled = SCHEDULED_TIMES.map(t => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }).sort((a, b) => a - b);
    for (const s of scheduled) {
      if (s > current) return s;
    }
    return scheduled[0] + 1440;
  }

  function scheduleNextRun() {
    const now = new Date();
    const nextMinutes = getNextScheduledTime();
    const next = new Date(now);
    next.setHours(Math.floor(nextMinutes / 60) % 24, nextMinutes % 60, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);

    const diff = next - now;
    document.getElementById('autoBadge').textContent =
      `⏳ Następne zaplanowane: ${next.toLocaleTimeString()} (za ${Math.round(diff/60000)} min)`;

    if (window._scheduledTimeout) clearTimeout(window._scheduledTimeout);
    window._scheduledTimeout = setTimeout(() => {
      fetchAndDisplay();
      scheduleNextRun();
    }, diff);
  }

  // ===== START =====
  window.addEventListener('DOMContentLoaded', () => {
    fetchAndDisplay().then(() => {
      renderHistory();
      scheduleNextRun();
    });
  });
</script>
