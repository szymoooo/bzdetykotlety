<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snajper over 3.5 pierwsza połowa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #eee;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #4caf50;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }
    .toolbar button {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2a2a3e;
      color: #eee;
      transition: 0.2s;
    }
    .toolbar button:hover { background: #3a3a5e; }
    .btn-primary {
      background: #4caf50 !important;
      color: #fff !important;
    }
    .btn-primary:hover { background: #66bb6a !important; }
    .btn-danger {
      background: #d32f2f !important;
      color: #fff !important;
    }
    .btn-danger:hover { background: #f44336 !important; }
    .btn-secondary {
      background: #1976d2 !important;
      color: #fff !important;
    }
    .btn-secondary:hover { background: #1e88e5 !important; }

    .status-bar {
      background: #1a1a2e;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .info {
      color: #aaa;
      font-size: 14px;
    }
    .badge {
      background: #4caf50;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
    }

    .kafelki {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .kafelek {
      background: #1a1a2e;
      border-left: 4px solid #4caf50;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .kafelek .title {
      font-size: 1.1em;
      font-weight: bold;
    }
    .kafelek .detail {
      color: #bbb;
      font-size: 14px;
    }
    .kafelek .detail strong { color: #eee; }
    .kafelek .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    .kafelek .input-group input {
      flex: 1;
      min-width: 60px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #eee;
      font-size: 16px;
      width: 80px;
    }
    .kafelek .input-group button {
      padding: 6px 16px;
      background: #4caf50;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    .kafelek .input-group button:hover { background: #66bb6a; }
    .status-pending {
      background: #f57c00;
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      color: #fff;
    }

    .no-results {
      color: #ff6b6b;
      padding: 30px;
      text-align: center;
      background: #1a1a2e;
      border-radius: 8px;
    }

    .history-section {
      margin-top: 40px;
      border-top: 2px solid #333;
      padding-top: 20px;
    }
    .history-section h2 { color: #90caf9; }
    .history-item {
      background: #12121f;
      padding: 10px 16px;
      margin: 6px 0;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px 12px;
    }
    .history-item .main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
    }
    .history-item .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #bbb;
      font-size: 13px;
    }
    .history-item .details .detail strong { color: #eee; }
    .history-item .date {
      color: #888;
      font-size: 12px;
      margin-left: auto;
    }
    .win { color: #4caf50; font-weight: bold; }
    .lose { color: #ef5350; font-weight: bold; }

    /* Formularz ręcznego dodawania */
    .manual-form {
      background: #1a1a2e;
      padding: 16px 20px;
      border-radius: 8px;
      margin: 20px 0 10px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .manual-form label {
      color: #ccc;
      font-size: 14px;
    }
    .manual-form input {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f0f1a;
      color: #eee;
      font-size: 14px;
      flex: 1 1 180px;
      min-width: 120px;
    }
    .manual-form button {
      padding: 6px 20px;
      background: #1976d2;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    .manual-form button:hover { background: #1e88e5; }
    .manual-form .info-text {
      color: #888;
      font-size: 13px;
      margin-left: auto;
    }

    @media (max-width: 600px) {
      .toolbar button { width: 100%; }
      .status-bar { flex-direction: column; align-items: stretch; gap: 8px; }
      .history-item { flex-direction: column; align-items: flex-start; }
      .history-item .date { margin-left: 0; margin-top: 4px; }
      .manual-form { flex-direction: column; align-items: stretch; }
      .manual-form .info-text { margin-left: 0; }
    }
  </style>
</head>
<body>

<h1>⚽ Snajper over 3.5 pierwsza połowa</h1>

<div class="toolbar">
  <button class="btn-primary" onclick="fetchAndDisplay()">🔄 Sprawdź teraz</button>
  <button class="btn-danger" onclick="clearHistory()">🗑️ Wyczyść historię</button>
  <button onclick="exportHistory()">📥 Eksportuj historię (JSON)</button>
</div>

<div class="status-bar">
  <span class="info" id="lastUpdate">Ostatnie sprawdzenie: —</span>
  <span class="info" id="matchCount">Aktywne: 0</span>
  <span class="badge" id="autoBadge">⏳ Następne zaplanowane: —</span>
</div>

<div id="kafelkiContainer" class="kafelki">
  <div class="no-results">⏳ Kliknij "Sprawdź teraz" lub poczekaj na automatyczne odświeżenie...</div>
</div>

<!-- FORMULARZ RĘCZNEGO DODAWANIA -->
<div class="manual-form">
  <label for="manualMatchName">Nazwa meczu:</label>
  <input type="text" id="manualMatchName" placeholder="np. Lland vs St" style="flex:2;">
  <label for="manualCorners">Rzuty rożne HT:</label>
  <input type="number" id="manualCorners" min="0" step="1" placeholder="liczba" style="width:100px;">
  <button onclick="addManualRecord()">➕ Dodaj do historii</button>
  <span class="info-text">(Uzupełnij brakujące mecze)</span>
</div>

<div class="history-section">
  <h2>📜 Historia rozstrzygniętych</h2>
  <div id="historyContainer">
    <p style="color:#888;">Brak zapisanej historii.</p>
  </div>
</div>

<script>
  // ===== KONFIGURACJA =====
  const PROGI = {
    A: { nazwa: 'U5.5', wartosc: 0 },
    B: { nazwa: 'SZYBKI ATAK: ROŻNY (OVER)', minPkt: 90 },
    C: { nazwa: 'ROŻNE HT (OVER 4.5)', minPkt: 90 },
    D: { nazwa: 'DOMINACJA', minPkt: 80 }
  };
  const SOURCE_URL = 'https://szymoooo.github.io/bzdetykotlety/auto.html';
  const SCHEDULED_TIMES = ['09:00', '10:00', '11:00'];

  // ===== TWOJA LOGIKA PARSOWANIA (na podstawie vs) =====
  function parseMatchesFromText(text) {
    const vsRegex = /([A-Za-zżźćńółęąś]+\s+vs\s+[A-Za-zżźćńółęąś]+)/g;
    let matches = [];
    let m;
    while ((m = vsRegex.exec(text)) !== null) {
      matches.push({
        start: m.index,
        end: m.index + m[0].length,
        full: m[0]
      });
    }

    const bloki = [];
    for (let i = 0; i < matches.length; i++) {
      const start = matches[i].start;
      const end = (i + 1 < matches.length) ? matches[i+1].start : text.length;
      const block = text.substring(start, end);
      bloki.push(block);
    }

    const wyniki = [];
    bloki.forEach(block => {
      const u55Match = block.match(/U5\.5:\s*(\d+)/);
      const u55 = u55Match ? parseInt(u55Match[1]) : null;

      const scoreHighs = [];
      const regex = /(SZYBKI ATAK|ROŻNE HT|DOMINACJA)[^]*?(\d+)\s*pkt/g;
      let match;
      while ((match = regex.exec(block)) !== null) {
        const nazwa = match[1].trim();
        const pkt = parseInt(match[2]);
        // Dodajemy tylko unikalne? – dla uproszczenia zostawiamy wszystkie, ale w historii pokażemy tylko pierwsze wystąpienie każdego modelu (później)
        if (nazwa.includes('SZYBKI ATAK') || nazwa.includes('ROŻNE HT') || nazwa.includes('DOMINACJA')) {
          scoreHighs.push({ nazwa, pkt });
        }
      }

      const passA = (u55 !== null && u55 === PROGI.A.wartosc);
      const passB = scoreHighs.some(s => s.nazwa.includes('SZYBKI ATAK') && s.pkt >= PROGI.B.minPkt);
      const passC = scoreHighs.some(s => s.nazwa.includes('ROŻNE HT') && s.pkt >= PROGI.C.minPkt);
      const passD = scoreHighs.some(s => s.nazwa.includes('DOMINACJA') && s.pkt >= PROGI.D.minPkt);

      if (passA && passB && passC && passD) {
        const nazwyMatch = block.match(/[A-Za-zżźćńółęąś]+\s+vs\s+[A-Za-zżźćńółęąś]+/);
        const tytul = nazwyMatch ? nazwyMatch[0] : 'Nieznany mecz';

        const pendingMatch = block.match(/PENDING/g);
        const isPending = pendingMatch ? pendingMatch.length > 0 : false;

        // Usuwamy duplikaty – zostawiamy tylko pierwsze wystąpienie każdego modelu
        const unique = [];
        const seen = new Set();
        for (const item of scoreHighs) {
          const key = item.nazwa;
          if (!seen.has(key)) {
            seen.add(key);
            unique.push(item);
          }
        }

        wyniki.push({
          tytul,
          u55,
          scoreHighs: unique,
          isPending
        });
      }
    });
    return wyniki;
  }

  function getMatchKey(match) {
    return match.tytul + '|' + match.u55;
  }

  // ===== FORMATOWANIE DATY =====
  function formatDate(date) {
    const d = new Date(date);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    const sec = String(d.getSeconds()).padStart(2, '0');
    return `${dd}.${mm}.${yyyy}, ${hh}:${min}:${sec}`;
  }

  // ===== GŁÓWNA FUNKCJA =====
  async function fetchAndDisplay() {
    const container = document.getElementById('kafelkiContainer');
    const lastUpdateSpan = document.getElementById('lastUpdate');
    const matchCountSpan = document.getElementById('matchCount');

    try {
      container.innerHTML = '<div class="no-results">⏳ Ładowanie danych...</div>';

      const response = await fetch(SOURCE_URL);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const html = await response.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const text = doc.body.innerText;

      const znalezione = parseMatchesFromText(text);
      const history = getHistory();
      const historyKeys = new Set(history.map(h => h.key));

      const aktywne = znalezione.filter(m => m.isPending && !historyKeys.has(getMatchKey(m)));

      if (aktywne.length === 0) {
        container.innerHTML = '<div class="no-results">❌ Brak aktywnych meczów spełniających kryteria.</div>';
      } else {
        let htmlOut = '';
        aktywne.forEach((m, idx) => {
          const key = getMatchKey(m);
          const scoreHighsJSON = JSON.stringify(m.scoreHighs);
          htmlOut += `
            <div class="kafelek" data-key="${key}" data-scorehighs='${scoreHighsJSON}'>
              <div class="title">${m.tytul}</div>
              <div class="detail"><strong>U5.5:</strong> ${m.u55}</div>
              ${m.scoreHighs.map(s => `<div class="detail"><strong>${s.nazwa}:</strong> ${s.pkt} pkt</div>`).join('')}
              <div class="detail"><span class="status-pending">PENDING</span></div>
              <div class="input-group">
                <input type="number" id="corners_${idx}" min="0" step="1" placeholder="Rzuty rożne HT" style="width:100px;">
                <button onclick="saveResult('${key}', ${idx})">Zapisz</button>
              </div>
            </div>
          `;
        });
        container.innerHTML = htmlOut;
      }

      matchCountSpan.textContent = `Aktywne: ${aktywne.length}`;
      lastUpdateSpan.textContent = `Ostatnie sprawdzenie: ${new Date().toLocaleString()}`;

    } catch (error) {
      container.innerHTML = `<div class="no-results">❌ Błąd: ${error.message}</div>`;
      console.error(error);
    }
  }

  // ===== ZAPIS WYNIKU (z kafelka) =====
  function saveResult(key, idx) {
    const input = document.getElementById(`corners_${idx}`);
    if (!input) return;
    const val = parseInt(input.value);
    if (isNaN(val) || val < 0) {
      alert('Wpisz poprawną liczbę rzutów rożnych (≥0)');
      return;
    }

    const kafelek = document.querySelector(`.kafelek[data-key="${key}"]`);
    if (!kafelek) {
      alert('Ten mecz został już rozstrzygnięty.');
      return;
    }

    let scoreHighs = [];
    try {
      const raw = kafelek.dataset.scorehighs;
      if (raw) scoreHighs = JSON.parse(raw);
    } catch(e) {}

    const titleEl = kafelek.querySelector('.title');
    const tytul = titleEl ? titleEl.textContent : 'Nieznany mecz';

    const status = val >= 4 ? 'WYGRANY' : 'PRZEGRANY';

    const history = getHistory();
    history.push({
      key: key,
      tytul: tytul,
      corners: val,
      status: status,
      scoreHighs: scoreHighs,
      date: new Date().toISOString()
    });
    saveHistory(history);

    kafelek.remove();

    const countSpan = document.getElementById('matchCount');
    const activeCount = document.querySelectorAll('.kafelek').length;
    countSpan.textContent = `Aktywne: ${activeCount}`;

    if (activeCount === 0) {
      const container = document.getElementById('kafelkiContainer');
      container.innerHTML = '<div class="no-results">❌ Brak aktywnych meczów spełniających kryteria.</div>';
    }

    renderHistory();
    alert(`Zapisano: ${tytul} → ${val} rzutów rożnych → ${status}`);
  }

  // ===== RĘCZNE DODAWANIE DO HISTORII =====
  function addManualRecord() {
    const nameInput = document.getElementById('manualMatchName');
    const cornersInput = document.getElementById('manualCorners');
    const name = nameInput.value.trim();
    const corners = parseInt(cornersInput.value);

    if (!name) {
      alert('Wpisz nazwę meczu (np. "Lland vs St")');
      return;
    }
    if (isNaN(corners) || corners < 0) {
      alert('Wpisz poprawną liczbę rzutów rożnych (≥0)');
      return;
    }

    // Generujemy klucz – jeśli mecz o takiej nazwie już istnieje w historii, dodajemy kolejny wpis (nie sprawdzamy duplikatów)
    const key = name + '|manual_' + Date.now();
    const status = corners >= 4 ? 'WYGRANY' : 'PRZEGRANY';
    const history = getHistory();
    history.push({
      key: key,
      tytul: name,
      corners: corners,
      status: status,
      scoreHighs: [], // brak danych punktowych (można dodać opcjonalnie)
      date: new Date().toISOString()
    });
    saveHistory(history);

    // Czyścimy pola
    nameInput.value = '';
    cornersInput.value = '';

    renderHistory();
    alert(`Dodano: ${name} → ${corners} rzutów rożnych → ${status}`);
  }

  // ===== OBSŁUGA HISTORII (localStorage) =====
  function getHistory() {
    try {
      const data = localStorage.getItem('snajperHistory');
      return data ? JSON.parse(data) : [];
    } catch { return []; }
  }
  function saveHistory(history) {
    localStorage.setItem('snajperHistory', JSON.stringify(history));
  }
  function clearHistory() {
    if (confirm('Usunąć całą historię?')) {
      localStorage.removeItem('snajperHistory');
      renderHistory();
      fetchAndDisplay();
    }
  }
  function exportHistory() {
    const history = getHistory();
    if (history.length === 0) { alert('Brak historii.'); return; }
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `historia_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function renderHistory() {
    const container = document.getElementById('historyContainer');
    const history = getHistory();
    if (history.length === 0) {
      container.innerHTML = '<p style="color:#888;">Brak zapisanej historii.</p>';
      return;
    }
    const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
    let html = '';
    sorted.forEach(h => {
      const statusClass = h.status === 'WYGRANY' ? 'win' : 'lose';
      const dateStr = formatDate(h.date);
      let detailsHtml = '';
      if (h.scoreHighs && h.scoreHighs.length) {
        detailsHtml = h.scoreHighs.map(s => 
          `<span class="detail"><strong>${s.nazwa}:</strong> ${s.pkt} pkt</span>`
        ).join('');
      }
      html += `
        <div class="history-item">
          <div class="main">
            <strong>${h.tytul}</strong>
            <span class="${statusClass}">${h.status}</span>
            <span>(${h.corners} rzutów rożnych)</span>
          </div>
          <div class="details">
            ${detailsHtml}
          </div>
          <div class="date">🕒 ${dateStr}</div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  // ===== HARMONOGRAM =====
  function getNextScheduledTime() {
    const now = new Date();
    const current = now.getHours() * 60 + now.getMinutes();
    const scheduled = SCHEDULED_TIMES.map(t => {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }).sort((a, b) => a - b);
    for (const s of scheduled) {
      if (s > current) return s;
    }
    return scheduled[0] + 1440;
  }

  function scheduleNextRun() {
    const now = new Date();
    const nextMinutes = getNextScheduledTime();
    const next = new Date(now);
    next.setHours(Math.floor(nextMinutes / 60) % 24, nextMinutes % 60, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);

    const diff = next - now;
    document.getElementById('autoBadge').textContent =
      `⏳ Następne zaplanowane: ${next.toLocaleTimeString()} (za ${Math.round(diff/60000)} min)`;

    if (window._scheduledTimeout) clearTimeout(window._scheduledTimeout);
    window._scheduledTimeout = setTimeout(() => {
      fetchAndDisplay();
      scheduleNextRun();
    }, diff);
  }

  // ===== START =====
  window.addEventListener('DOMContentLoaded', () => {
    fetchAndDisplay().then(() => {
      renderHistory();
      scheduleNextRun();
    });
  });
</script>
</body>
</html>
